spring.application.name=JobMs
spring.cloud.config.import-check.enabled=true
spring.cloud.config.fail-fast=true
spring.config.import=optional:configserver:http://config-server:8099
server.port=8083
spring.datasource.url=jdbc:mysql://db-mysql:3306/jobTest3SDE2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://eureka:8761/eureka
eureka.client.register-with-eureka=true
# Spring RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
